<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Выживание на крышах</title>
    <style>
        @font-face { font-family: 'Rubik'; src: url('assets/fonts/rubik.ttf?v=0.1.5') format('truetype'); font-weight: 300 900; font-display: block; }
        :root {
            --line: #0b1018; --panel: #1b2433; --panel2: #243044; --panel3: #2e3c55; --text: #ffffff; --muted: #9fb0c8;
            --yellow: #ffcf2e; --green: #5ccf3a; --blue: #3a9cff; --orange: #ff8a1f; --purple: #9b5cff; --red: #ff4d4d;
            --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
            --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
        }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a2230;
            -webkit-touch-callout: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            font-family: 'Rubik', system-ui, sans-serif; -webkit-tap-highlight-color: transparent;
        }
        input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
        img { -webkit-user-drag: none; }
        #world3d { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }

        /* --- загрузка ------------------------------------------------------------- */
        #loading-screen {
            position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; z-index: 1000;
            background: radial-gradient(120% 80% at 50% 30%, #3b4a63 0%, #1a2230 60%, #0d121a 100%);
        }
        #loading-screen::before {
            content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 38%; opacity: .5;
            background: linear-gradient(90deg, #0b1018 0 8%, transparent 8% 12%, #0b1018 12% 22%, transparent 22% 25%, #0b1018 25% 33%, transparent 33% 37%, #0b1018 37% 52%, transparent 52% 55%, #0b1018 55% 64%, transparent 64% 67%, #0b1018 67% 80%, transparent 80% 83%, #0b1018 83% 100%);
            -webkit-mask: linear-gradient(transparent, #000 30%); mask: linear-gradient(transparent, #000 30%);
        }
        .load-logo { margin: 0; text-align: center; line-height: .88; position: relative; }
        #loading-title { margin: 0; position: relative; padding: 6px 16px; border-radius: 12px; background: #0b1018d9; border: 3px solid #0b1018; font: 800 17px 'Rubik', system-ui, sans-serif; color: #ffe7a3; letter-spacing: 2px; text-transform: uppercase; }
        .boot #loading-title, #loading-title:empty { display: none; }
        .load-logo .l1, .load-logo .l2, .load-logo .l3 { display: block; font-weight: 900; font-size: clamp(34px, 9.5vmin, 90px); letter-spacing: 1px; }
        .load-logo .l3 { font-size: clamp(24px, 6.4vmin, 60px); letter-spacing: 6px; color: #fff; margin-top: 6px; text-shadow: 0 4px 0 #1d5fa8, 3px 3px 0 #06101a, -3px 3px 0 #06101a, 3px -3px 0 #06101a, -3px -3px 0 #06101a, 0 7px 0 #06101a; transform: rotate(-4deg) translateX(-4%); }
        .load-logo .l1 { color: var(--yellow); text-shadow: 0 5px 0 #b37d06, 3px 3px 0 #1a1206, -3px 3px 0 #1a1206, 3px -3px 0 #1a1206, -3px -3px 0 #1a1206, 0 9px 0 #1a1206; transform: rotate(-4deg); }
        .load-logo .l2 { color: var(--red); text-shadow: 0 5px 0 #8f1d1d, 3px 3px 0 #1a0606, -3px 3px 0 #1a0606, 3px -3px 0 #1a0606, -3px -3px 0 #1a0606, 0 9px 0 #1a0606; transform: rotate(-4deg) translateX(10%); }
        .loading-text { font: 600 15px 'Rubik', system-ui, sans-serif; color: #c8d3e3; text-align: center; min-height: 1em; position: relative; }
        .loading-bar { width: min(300px, 72vw); height: 18px; background: #0b1018; border: 3px solid #0b1018; border-radius: 12px; overflow: hidden; position: relative; box-shadow: 0 4px 0 #05080c; }
        .loading-progress { height: 100%; width: 0%; background: linear-gradient(#ffe066 0 45%, #ffcf2e 46%); border-radius: 8px; transition: width 0.3s ease; }
        #loading-percent { font: 900 20px 'Rubik', system-ui, sans-serif; color: #fff; text-shadow: 0 3px 0 #0b1018; position: relative; }
        #loading-retry { padding: 12px 24px; border: 3px solid var(--line); border-radius: 14px; background: var(--green); color: #fff; font: 800 17px 'Rubik', system-ui, sans-serif; cursor: pointer; box-shadow: 0 5px 0 #2f8a1c; }

        /* --- основа интерфейса ------------------------------------------------------ */
        #ui { position: fixed; inset: 0; z-index: 20; pointer-events: none; color: var(--text); font-family: 'Rubik', system-ui, sans-serif; }
        #ui .scr { position: absolute; inset: 0; display: none; }
        #ui .scr.on { display: block; }
        #ui button { font-family: inherit; }
        .ic { display: inline-block; width: 1.25em; height: 1.25em; flex: none; background: currentColor;
            -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
        .ic-pause { --m: url('assets/sprites/ic-pause.png?v=0.1.5'); } .ic-audioon { --m: url('assets/sprites/ic-audioon.png?v=0.1.5'); } .ic-audiooff { --m: url('assets/sprites/ic-audiooff.png?v=0.1.5'); }
        .ic-home { --m: url('assets/sprites/ic-home.png?v=0.1.5'); } .ic-locked { --m: url('assets/sprites/ic-locked.png?v=0.1.5'); } .ic-star { --m: url('assets/sprites/ic-star.png?v=0.1.5'); }
        .ic-shoppingcart { --m: url('assets/sprites/ic-shoppingcart.png?v=0.1.5'); } .ic-video { --m: url('assets/sprites/ic-video.png?v=0.1.5'); } .ic-menugrid { --m: url('assets/sprites/ic-menugrid.png?v=0.1.5'); }
        .ic-arrowup { --m: url('assets/sprites/ic-arrowup.png?v=0.1.5'); } .ic-checkmark { --m: url('assets/sprites/ic-checkmark.png?v=0.1.5'); } .ic-return { --m: url('assets/sprites/ic-return.png?v=0.1.5'); }
        .ic-trashcan { --m: url('assets/sprites/ic-trashcan.png?v=0.1.5'); } .ic-left { --m: url('assets/sprites/ic-left.png?v=0.1.5'); } .ic-right { --m: url('assets/sprites/ic-right.png?v=0.1.5'); }
        .ic-fightfist { --m: url('assets/sprites/ic-fightfist.png?v=0.1.5'); } .ic-fastforward { --m: url('assets/sprites/ic-fastforward.png?v=0.1.5'); } .ic-target { --m: url('assets/sprites/ic-target.png?v=0.1.5'); }
        .coin, .heart { display: inline-block; width: 1.3em; height: 1.3em; flex: none; background: url('assets/ui/coin.png?v=0.1.5') center / contain no-repeat; filter: drop-shadow(0 2px 0 #0006); }
        .heart { background-image: url('assets/ui/heart.png?v=0.1.5'); }
        /* Иконки ImageGen (assets/ui): цветные картинки вместо масок Kenney — те же классы .ic-*. */
        .ic.img { -webkit-mask: none; mask: none; background: var(--i) center / contain no-repeat; }
        .ic.ic-pause { -webkit-mask: none; mask: none; background: url('assets/ui/pause.png?v=0.1.5') center / contain no-repeat; }
        .ic.ic-audioon { -webkit-mask: none; mask: none; background: url('assets/ui/sound-on.png?v=0.1.5') center / contain no-repeat; }
        .ic.ic-audiooff { -webkit-mask: none; mask: none; background: url('assets/ui/sound-off.png?v=0.1.5') center / contain no-repeat; }
        .ic.ic-home { -webkit-mask: none; mask: none; background: url('assets/ui/home.png?v=0.1.5') center / contain no-repeat; }
        .ic.ic-locked { -webkit-mask: none; mask: none; background: url('assets/ui/lock.png?v=0.1.5') center / contain no-repeat; }
        .ic.ic-star { -webkit-mask: none; mask: none; background: url('assets/ui/star.png?v=0.1.5') center / contain no-repeat; }
        .ic.ic-shoppingcart { -webkit-mask: none; mask: none; background: url('assets/ui/shop.png?v=0.1.5') center / contain no-repeat; }
        .ic.ic-video { -webkit-mask: none; mask: none; background: url('assets/ui/reward-video.png?v=0.1.5') center / contain no-repeat; }
        .ic.ic-menugrid { -webkit-mask: none; mask: none; background: url('assets/ui/levels.png?v=0.1.5') center / contain no-repeat; }
        .ic.ic-arrowup { -webkit-mask: none; mask: none; background: url('assets/ui/upgrade.png?v=0.1.5') center / contain no-repeat; }
        .ic.ic-checkmark { -webkit-mask: none; mask: none; background: url('assets/ui/check.png?v=0.1.5') center / contain no-repeat; }
        .ic.ic-return { -webkit-mask: none; mask: none; background: url('assets/ui/restart.png?v=0.1.5') center / contain no-repeat; }
        .ic.ic-trashcan { -webkit-mask: none; mask: none; background: url('assets/ui/sell.png?v=0.1.5') center / contain no-repeat; }
        .ic.ic-left { -webkit-mask: none; mask: none; background: url('assets/ui/back.png?v=0.1.5') center / contain no-repeat; }
        .ic.ic-right { -webkit-mask: none; mask: none; background: url('assets/ui/next.png?v=0.1.5') center / contain no-repeat; }
        .ic.ic-fightfist { -webkit-mask: none; mask: none; background: url('assets/ui/skull.png?v=0.1.5') center / contain no-repeat; }
        .ic.ic-fastforward { -webkit-mask: none; mask: none; background: url('assets/ui/up-firerate.png?v=0.1.5') center / contain no-repeat; }
        .ic.ic-auto { -webkit-mask: none; mask: none; background: url('assets/ui/auto.png?v=0.1.5') center / contain no-repeat; }

        .btn {
            --b: var(--green); --bd: #2e8a1b;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; pointer-events: auto; cursor: pointer;
            font-weight: 800; font-size: 17px; line-height: 1; letter-spacing: .3px; text-transform: uppercase; color: #fff;
            padding: 13px 18px 12px; min-height: 50px; border: 3px solid var(--line); border-radius: 16px;
            background: linear-gradient(#ffffff38 0 44%, #0000 46%), var(--b);
            box-shadow: inset 0 -4px 0 #0000002e, 0 5px 0 var(--bd), 0 8px 0 var(--line), 0 10px 18px #0006;
            text-shadow: 0 2px 0 #0000008c, 1px 1px 0 #0006, -1px 1px 0 #0006; transition: transform .07s, filter .15s; white-space: nowrap;
        }
        .btn:active:not([disabled]) { transform: translateY(5px); box-shadow: inset 0 -4px 0 #0000002e, 0 0 0 var(--bd), 0 3px 0 var(--line); }
        .btn[disabled] { filter: grayscale(.75) brightness(.8); cursor: default; }
        .btn .ic { width: 1.35em; height: 1.35em; filter: drop-shadow(0 2px 0 #0007); }
        .btn.big { font-size: 24px; padding: 16px 28px 15px; min-height: 64px; border-radius: 20px; }
        .btn.blue { --b: var(--blue); --bd: #1d5fa8; } .btn.orange { --b: var(--orange); --bd: #b25708; } .btn.purple { --b: var(--purple); --bd: #5d2fb0; }
        .btn.red { --b: var(--red); --bd: #a82424; } .btn.pink { --b: #ff4fa3; --bd: #a3236a; }
        .btn .bimg { width: 34px; height: 34px; object-fit: contain; margin: -8px -2px; filter: drop-shadow(0 2px 0 #0008); }
        .btn .new { position: absolute; top: -10px; right: -8px; padding: 2px 6px; border-radius: 8px; font-size: 10px; letter-spacing: .5px; background: linear-gradient(90deg, #ff3df0, #ffd23a); border: 2px solid var(--line); animation: pulse 1s infinite; } .btn.yellow { --b: var(--yellow); --bd: #b58c07; color: #3a2600; text-shadow: 0 1px 0 #fff8; }
        .round {
            pointer-events: auto; cursor: pointer; width: 50px; height: 50px; border-radius: 16px; border: 3px solid var(--line); color: #fff;
            background: linear-gradient(#ffffff2e 0 44%, #0000 46%), var(--panel3); box-shadow: 0 4px 0 #111826, 0 6px 0 var(--line);
            display: inline-flex; align-items: center; justify-content: center; flex: none;
        }
        .round .ic { width: 26px; height: 26px; }
        .round:active { transform: translateY(4px); box-shadow: 0 0 0 #111826, 0 2px 0 var(--line); }
        .pill {
            pointer-events: auto; display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 8px 0 8px; border-radius: 22px;
            background: #0b1018cc; border: 3px solid var(--line); font-weight: 800; font-size: 19px; box-shadow: inset 0 2px 0 #ffffff14;
        }
        .pill b { min-width: 44px; text-shadow: 0 2px 0 #000; }
        .pill.stars .ic { color: var(--yellow); }
        .pill .plus { width: 32px; height: 32px; border: 0; background: none; cursor: pointer; padding: 0; } .pill .plus img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 2px 0 #0008); }
        .round.gift { position: relative; background: linear-gradient(#ffffff2e 0 44%, #0000 46%), #c0392b; } .round.gift img { width: 38px; height: 38px; object-fit: contain; animation: bob 1.6s ease-in-out infinite; }
        .round.gift .dot { top: -8px; right: -8px; }
        .h2i { width: 1.25em; height: 1.25em; object-fit: contain; vertical-align: -0.28em; margin-right: 8px; filter: drop-shadow(0 3px 0 #0008); }
        .pill.small { height: 36px; font-size: 16px; }
        .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .grow { flex: 1; }

        /* --- меню ------------------------------------------------------------------- */
        #scr-menu { background: linear-gradient(#0b1018b0, #0b101800 28%, #0b101800 55%, #0b1018c8); }
        .topbar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 10px; padding: calc(12px + var(--safe-t)) calc(14px + var(--safe-r)) 0 calc(14px + var(--safe-l)); }
        .logo { position: absolute; left: 0; right: 0; top: 13%; text-align: center; line-height: .86; pointer-events: none; animation: logoIn .7s cubic-bezier(.2,1.6,.4,1) both; }
        .logo .l1, .logo .l2, .logo .l3 { font-weight: 900; font-size: clamp(38px, 11vmin, 116px); letter-spacing: 1px; display: block; }
        .logo .l3 { font-size: clamp(26px, 7vmin, 72px); letter-spacing: 7px; color: #fff; margin-top: 4px; transform: rotate(-4deg) translateX(-5%); text-shadow: 0 5px 0 #1d5fa8, 4px 4px 0 #06101a, -4px 4px 0 #06101a, 4px -4px 0 #06101a, -4px -4px 0 #06101a, 0 9px 0 #06101a, 0 16px 26px #000a; }
        .logo .l1 { color: var(--yellow); transform: rotate(-4deg); text-shadow: 0 6px 0 #b37d06, 4px 4px 0 #140e03, -4px 4px 0 #140e03, 4px -4px 0 #140e03, -4px -4px 0 #140e03, 0 11px 0 #140e03, 0 18px 30px #000a; }
        .logo .l2 { color: var(--red); transform: rotate(-4deg) translateX(9%); text-shadow: 0 6px 0 #8f1d1d, 4px 4px 0 #160404, -4px 4px 0 #160404, 4px -4px 0 #160404, -4px -4px 0 #160404, 0 11px 0 #160404, 0 18px 30px #000a; }
        .logo .tag { display: inline-block; margin-top: 18px; padding: 7px 16px; border-radius: 12px; background: #0b1018d9; border: 3px solid var(--line); font-weight: 800; font-size: clamp(13px, 2.4vmin, 19px); color: #ffe7a3; letter-spacing: 2px; text-transform: uppercase; transform: rotate(-2deg); }
        @keyframes logoIn { from { transform: scale(.4) translateY(-40px); opacity: 0; } }
        .menu-bottom { position: absolute; left: 0; right: 0; bottom: calc(22px + var(--safe-b)); display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 0 14px; }
        .menu-bottom .btn.big { min-width: min(360px, 84vw); flex-direction: column; gap: 4px; }
        .menu-bottom .btn.big small { font-size: 14px; opacity: .92; letter-spacing: 1px; }
        .menu-bottom .row .btn { min-width: 150px; position: relative; }
        .pulse { animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse { 50% { transform: scale(1.05); } }
        .dot { position: absolute; top: -9px; right: -9px; width: 22px; height: 22px; border-radius: 50%; background: var(--red); border: 3px solid var(--line); display: none; animation: pulse 1s infinite; }
        .dot.on { display: block; }

        /* --- экраны-панели (уровни, магазин) ------------------------------------------ */
        .panel-scr { background: linear-gradient(160deg, #1f2a3dF2, #111824F7); pointer-events: auto !important; }
        .panel-scr .head { position: absolute; left: 0; right: 0; top: 0; height: calc(70px + var(--safe-t)); display: flex; align-items: center; gap: 12px;
            padding: var(--safe-t) calc(14px + var(--safe-r)) 0 calc(14px + var(--safe-l)); background: linear-gradient(#0b1018, #141c29); border-bottom: 3px solid var(--line); box-shadow: 0 4px 0 #0004; z-index: 2; }
        .panel-scr .head h2 { flex: 1; margin: 0; font-weight: 900; font-size: 28px; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 3px 0 #000; }
        .lv-scroll { position: absolute; left: 0; right: 0; top: calc(70px + var(--safe-t)); bottom: 0; overflow-y: auto; padding: 16px calc(14px + var(--safe-r)) calc(24px + var(--safe-b)) calc(14px + var(--safe-l)); -webkit-overflow-scrolling: touch; }
        .chapter { --hue: calc(var(--ch) * 36deg); max-width: 980px; margin: 0 auto 18px; border-radius: 20px; padding: 12px; border: 3px solid var(--line);
            background: linear-gradient(hsl(calc(200deg + var(--hue)) 35% 28%), hsl(calc(200deg + var(--hue)) 35% 18%)); box-shadow: 0 5px 0 var(--line); }
        .chname { display: flex; align-items: flex-end; gap: 10px; font-weight: 900; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 12px; text-shadow: 0 2px 0 #000, 2px 2px 0 #000, -2px 2px 0 #000;
            height: clamp(84px, 16vw, 130px); padding: 10px 12px; border-radius: 14px; border: 3px solid var(--line); box-sizing: border-box; background: #1b2433 center / cover no-repeat; box-shadow: inset 0 -60px 40px -30px #000c; }
        .ch0 { background-image: url('assets/ui/chapter-0.jpg?v=0.1.5'); } .ch1 { background-image: url('assets/ui/chapter-1.jpg?v=0.1.5'); } .ch2 { background-image: url('assets/ui/chapter-2.jpg?v=0.1.5'); }
        .ch3 { background-image: url('assets/ui/chapter-3.jpg?v=0.1.5'); } .ch4 { background-image: url('assets/ui/chapter-4.jpg?v=0.1.5'); } .ch5 { background-image: url('assets/ui/chapter-5.jpg?v=0.1.5'); }
        .ch6 { background-image: url('assets/ui/chapter-6.jpg?v=0.1.5'); } .ch7 { background-image: url('assets/ui/chapter-7.jpg?v=0.1.5'); } .ch8 { background-image: url('assets/ui/chapter-8.jpg?v=0.1.5'); }
        .ch9 { background-image: url('assets/ui/chapter-9.jpg?v=0.1.5'); }
        .chname b { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: #0b1018aa; }
        .lv-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; }
        .lv { position: relative; aspect-ratio: 1; border-radius: 14px; border: 3px solid var(--line); cursor: pointer; color: #fff; padding: 0;
            background: linear-gradient(#ffffff30 0 44%, #0000 46%), #3a4a66; box-shadow: 0 4px 0 #0b1018; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
        .lv.open { background: linear-gradient(#ffffff38 0 44%, #0000 46%), var(--blue); }
        .lv.cur { background: linear-gradient(#ffffff38 0 44%, #0000 46%), var(--green); animation: pulse 1.2s infinite; }
        .lv.locked { cursor: default; opacity: .75; }
        .lv.lv-boss.open { background: linear-gradient(#ffffff38 0 44%, #0000 46%), var(--orange); }
        .lv.lv-mega.open { background: linear-gradient(#ffffff38 0 44%, #0000 46%), var(--red); }
        .lv .num { font-weight: 900; font-size: clamp(15px, 3.4vmin, 24px); text-shadow: 0 2px 0 #000; }
        .lv .num .ic { width: 22px; height: 22px; color: #c9d4e6; }
        .lv .st { display: flex; gap: 1px; }
        .lv .s { width: 14px; height: 14px; background: url('assets/ui/star-empty.png?v=0.1.5') center / contain no-repeat; opacity: .8; }
        .lv .s.on { background-image: url('assets/ui/star.png?v=0.1.5'); opacity: 1; }
        .lv .skull img { width: 14px; height: 14px; vertical-align: -3px; margin-right: 2px; }
        .lv .skull { position: absolute; top: -8px; right: -6px; font-size: 9px; font-weight: 900; background: var(--red); border: 2px solid var(--line); border-radius: 8px; padding: 2px 4px; letter-spacing: .5px; }

        .shop-body { position: absolute; left: 0; right: 0; top: calc(70px + var(--safe-t)); bottom: 0; display: grid; grid-template-columns: 210px 1fr 300px; }
        .tabs { overflow-y: auto; padding: 10px 8px calc(12px + var(--safe-b)) calc(10px + var(--safe-l)); background: #0b101866; border-right: 3px solid var(--line); -webkit-overflow-scrolling: touch; }
        .tgroup { font-weight: 900; font-size: 12px; letter-spacing: 2px; color: var(--muted); margin: 10px 6px 6px; text-transform: uppercase; }
        .tab { width: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin: 0 0 6px; border-radius: 14px; border: 3px solid var(--line); cursor: pointer;
            background: linear-gradient(#ffffff1a 0 44%, #0000 46%), var(--panel2); color: #fff; font-weight: 800; font-size: 14px; text-align: left; box-shadow: 0 3px 0 var(--line); }
        .tab img, .tab .ic { width: 38px; height: 38px; object-fit: contain; flex: none; }
        .tab .ic { width: 30px; height: 30px; margin: 4px; color: var(--yellow); }
        .tab span { flex: 1; line-height: 1.1; }
        .tab em { font-style: normal; font-size: 11px; color: var(--muted); background: #0b1018aa; padding: 3px 6px; border-radius: 8px; }
        .tab.on { background: linear-gradient(#ffffff38 0 44%, #0000 46%), var(--orange); }
        .tab.on em { color: #fff; }
        .shop-main { overflow-y: auto; padding: 12px 14px calc(16px + var(--safe-b)); -webkit-overflow-scrolling: touch; }
        .shop-title { display: flex; align-items: baseline; gap: 12px; margin: 2px 4px 12px; }
        .shop-title h3 { margin: 0; font-weight: 900; font-size: 24px; text-transform: uppercase; text-shadow: 0 3px 0 #000; }
        .shop-title span { color: var(--muted); font-weight: 800; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 12px; }

    <script>
        // Игровая область: долгий тап и ПКМ не открывают меню браузера, картинки не
        // тянутся, текст не выделяется — кроме настоящих полей ввода.
        (() => {
            const isField = t => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
            for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
                document.addEventListener(type, e => { if (!isField(e.target)) e.preventDefault(); });
            }
        })();
